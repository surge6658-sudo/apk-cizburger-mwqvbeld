*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1a100b;font-family:Pix,monospace;font-weight:500;-webkit-font-smoothing:none;color:#fff;user-select:none;overflow:hidden}
body{display:flex;justify-content:center;align-items:center}
#app{width:min(100vw,calc((100vh - 120px)*1.7926));}
#stage{position:relative;width:100%;aspect-ratio:1376/768;overflow:hidden;image-rendering:pixelated}
#stage img{image-rendering:pixelated}
.abs{position:absolute}
#bg{position:absolute;inset:0;width:100%;height:100%}
#win{position:absolute;left:13.8%;top:5.5%;width:74.5%;height:64%;overflow:hidden}
#cust{position:absolute;bottom:-3%;width:25%;left:-30%;transition:left 1.6s ease-out;filter:drop-shadow(2px 0 0 #000) drop-shadow(-2px 0 0 #000) drop-shadow(0 2px 0 #000) drop-shadow(0 -2px 0 #000)}
#cust canvas{width:100%;display:block;image-rendering:pixelated}
#cust.walk{animation:bob .35s infinite alternate}
@keyframes bob{to{transform:translateY(-2.5%)}}
#bubble{position:absolute;left:58%;top:6%;min-width:16%;max-width:34%;background:#fff8e1;color:#222;border:4px solid #000;border-radius:10px;padding:1% 1.2%;display:none;flex-wrap:wrap;gap:6px;align-items:center;box-shadow:4px 4px 0 #0007}
#bubble.on{display:flex}
.o{display:flex;align-items:center;font-size:clamp(9px,1.5vw,20px)}
.o img{height:clamp(22px,4vw,54px);width:auto}
.o b{margin-left:2px}
#pat{width:100%;height:7px;background:#0004;border:2px solid #000;border-radius:4px;overflow:hidden}
#pat i{display:block;height:100%;background:#4c4;width:100%}
#grill{position:absolute;left:5.6%;top:77%;width:26.5%;height:14%;display:flex;gap:3%;align-items:center;justify-content:center}
.slot{position:relative;flex:1;height:100%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.slot img{width:88%;display:none}

const IMG={};
function prep(name,max,crop){return new Promise(res=>{const im=new Image();im.onload=()=>{try{
 const s=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s);
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingEnabled=false;x.drawImage(im,0,0,w,h);
 const d=x.getImageData(0,0,w,h),p=d.data,wh=i=>p[i+3]>10&&p[i]>240&&p[i+1]>240&&p[i+2]>240;
 if(wh(0)){const seen=new Uint8Array(w*h),st=[0];seen[0]=1;while(st.length){const k=st.pop(),i=k*4;if(!wh(i))continue;p[i+3]=0;const px=k%w;
  [px>0&&k-1,px<w-1&&k+1,k>=w&&k-w,k<w*(h-1)&&k+w].forEach(n=>{if(n!==false&&!seen[n]){seen[n]=1;st.push(n)}})}}
 x.putImageData(d,0,0);let x0=w,y0=h,x1=0,y1=0;
 if(crop){for(let y=0;y<h;y++)for(let q=0;q<w;q++)if(p[(y*w+q)*4+3]>10){if(q<x0)x0=q;if(q>x1)x1=q;if(y<y0)y0=y;if(y>y1)y1=y}}else{x0=0;y0=0;x1=w-1;y1=h-1}
 const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);res(o.toDataURL())
}catch(e){res(EMB[name])}};im.onerror=()=>res(EMB[name]);im.src=EMB[name]})}
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let G; // oyun durumu
const SAUCE={ketchup:'#e22',mustard:'#fc0',mayo:'#fff'};
const NAME={patty:'Köfte',cheese:'Peynir',tomato:'Domates',lettuce:'Marul',ketchup:'Ketçap',mustard:'Hardal',mayo:'Mayonez',fries:'Patates',cola:'Kola',bunB:'Alt ekmek',bunT:'Üst ekmek'};
const ico=k=>k=='patty'?IMG.cooked:k=='cheese'?null:k=='cola'?IMG.cola:IMG[k];
const chIco='<span class="cheese" style="width:34px;height:12px;border-width:3px;display:inline-block"></span>';

// === Müşteri çizimi (piksel) ===
const pick=a=>a[Math.random()*a.length|0];
const sh=(h,f)=>'#'+[1,3,5].map(i=>Math.round(parseInt(h.substr(i,2),16)*f).toString(16).padStart(2,'0')).join('');
function newPerson(){return{skin:pick(['#f1c27d','#e0a370','#c68642','#8d5524','#ffdbac']),hair:pick(['#222','#5a3a1a','#c8a040','#a33','#888','#e8e8e8']),shirt:pick(['#3a7bd5','#2e9e5b','#9b59b6','#e67e22','#16a0a0','#d35480','#666']),pants:pick(['#334','#445','#543','#235']),style:pick([0,1,2,3]),hat:Math.random()<.3?pick(['#d33','#38d','#fc0']):0,glasses:Math.random()<.3,beard:Math.random()<.25,pat:pick([0,0,1,2])}}
function drawPerson(c,p,m){const x=c.getContext('2d');x.clearRect(0,0,32,50);const r=(col,a,b,w,h)=>{x.fillStyle=col;x.fillRect(a,b,w,h)},sk=sh(p.skin,.82),s2=sh(p.shirt,.78),hd=sh(p.hair,.7);
 r(p.pants,10,38,6,10);r(p.pants,17,38,6,10);r(sh(p.pants,.7),15,38,2,10);r('#222',9,47,7,3);r('#222',17,47,7,3);
 r(p.shirt,8,22,17,17);r(s2,21,22,4,17);r(p.shirt,5,23,3,12);r(s2,24,23,3,12);r(p.skin,5,35,3,4);r(p.skin,24,35,3,4);
 if(p.pat==1)for(let y=25;y<39;y+=4)r(s2,8,y,17,1);
 if(p.pat==2){r('#fff',13,22,7,6);r('#c22',16,24,1,12)}
 r(sk,14,21,5,2);
 r(p.skin,10,6,13,16);r(p.skin,9,8,15,12);r(sk,21,8,3,12);r(p.skin,8,12,1,4);r(p.skin,24,12,1,4);
 if(p.style==0){r(p.hair,9,4,15,5);r(p.hair,9,8,2,5);r(p.hair,22,8,2,5)}
 if(p.style==1){r(p.hair,9,4,15,5);r(p.hair,8,8,3,18);r(p.hair,22,8,3,18)}
 if(p.style==2){r(p.hair,9,10,2,5);r(p.hair,22,10,2,5);r('#fff6',12,7,3,1)}
 if(p.style==3){r(p.hair,11,1,11,4);r(p.hair,9,4,15,5);r(p.hair,9,8,2,4);r(p.hair,22,8,2,4)}
 if(p.hat){r(p.hat,9,3,15,5);r(p.hat,8,7,17,2)}
 if(p.beard)r(p.hair,10,18,13,5);
 r('#fff',12,13,3,3);r('#fff',18,13,3,3);r('#111',13,14,2,2);r('#111',19,14,2,2);
 if(m<.35){r(hd,12,11,3,1);r(hd,18,11,3,1);r('#111',14,12,1,1);r('#111',18,12,1,1)}else{r(hd,12,11,3,1);r(hd,18,11,3,1)}
 r(sk,16,16,2,3);if(!p.beard){r('#f998',11,18,2,2);r('#f998',20,18,2,2)}
 if(p.glasses){[11,17].forEach(a=>{r('#111',a,12,5,1);r('#111',a,16,5,1);r('#111',a,12,1,5);r('#111',a+4,12,1,5)})}
 if(m<.35){r('#a22',14,19,5,1);r('#a22',13,20,1,1);r('#a22',19,20,1,1)}
 else if(m<.65){r('#a22',14,20,5,1)}
 else{r('#822',13,19,7,2);r('#fff',14,19,5,1)}}

// === Sipariş ===
function newOrder(){const n=G.served,o={patty:1};
 if(n>3&&Math.random()<Math.min(.6,n/20))o.patty=2;
 if(Math.random()<.5)o.cheese=1;if(Math.random()<.5)o.tomato=1;if(Math.random()<.5)o.lettuce=1;
 ['ketchup','mustard','mayo'].forEach(s=>{if(Math.random()<(n>2?.35:.15))o[s]=1});
 if(Math.random()<.5)o.fries=1;if(Math.random()<.4)o.cola=1;return o}
const price=o=>2+(o.patty||0)*3+['cheese','tomato','lettuce','ketchup','mustard','mayo'].reduce((a,k)=>a+(o[k]||0),0)+(o.fries?3:0)+(o.cola?2:0);

function showOrder(){const b=$('#bubble');b.innerHTML='';
 for(const k in G.cust.order){const v=G.cust.order[k],s=document.createElement('span');s.className='o';
  s.innerHTML=(k=='cheese'?chIco:`<img src="${ico(k)}">`)+(v>1?`<b>x${v}</b>`:'');b.appendChild(s)}
 b.insertAdjacentHTML('beforeend','<div id="pat"><i></i></div>');b.classList.add('on')}

async function spawn(){if(!G.alive)return;
 const p=newPerson(),c=document.createElement('canvas');c.width=32;c.height=50;drawPerson(c,p,1);
 const el=$('#cust');el.innerHTML='';el.style.transition='none';el.style.left='-30%';el.appendChild(c);void el.offsetWidth;
 el.style.transition='left 1.6s ease-out';el.classList.add('walk');el.style.left='37%';
 G.cust={p,c,order:newOrder(),t:0,max:Math.max(26,48-G.served*1.2)*(G.up.pat?1.35:1),here:false};
 await sleep(1650);if(!G.alive)return;el.classList.remove('walk');G.cust.here=true;showOrder();SFX.bell()}
async function leave(){const el=$('#cust');G.cust.here=false;$('#bubble').classList.remove('on');el.classList.add('walk');el.style.left='120%';await sleep(1700);el.classList.remove('walk');G.cust=null;if(G.alive)spawn()}

// === Tepsi / ızgara ===
function reach(){return;const h=$('#hands');h.classList.add('up');setTimeout(()=>h.classList.remove('up'),300)}
function toast(t,c){const e=$('#toast');e.textContent=t;e.style.color=c||'#fff';e.classList.remove('show');void e.offsetWidth;e.classList.add('show')}
const TH={bunB:12,patty:13,raw:13,burnt:13,cheese:6,tomato:7,lettuce:10,ketchup:4,mustard:4,mayo:4,bunT:0},WD={bunB:100,bunT:100,patty:88,raw:88,burnt:88,tomato:72,lettuce:100,cheese:84};
function renderTray(){const st=$('#bstack'),sd=$('#side');st.innerHTML='';sd.innerHTML='';$('#stack').innerHTML='';
 const done=G.layers.includes('bunT');let acc=0;
 if(done){const bad=G.layers.includes('burnt')||G.layers.includes('raw');sd.innerHTML+=`<img src="${IMG.burger}" style="left:20%;top:32%;width:30%;${bad?'filter:brightness(.5) sepia(.5)':''}">`}
 else G.layers.forEach((k,i)=>{let e;
  if(SAUCE[k]){e=document.createElement('div');e.style.cssText=`background:${SAUCE[k]};border:1.2cqw solid #000;height:5cqw;border-radius:3cqw;width:44cqw`}
  else{e=new Image();e.src=k=='cheese'?IMG.cheese:k=='raw'?IMG.raw:k=='patty'||k=='burnt'?IMG.cooked:IMG[k];e.style.width=(WD[k]||100)+'cqw';if(k=='burnt')e.style.filter='brightness(.3)'}
  e.className='ly'+(i==G.layers.length-1?' new':'');e.style.bottom=acc+'cqw';acc+=TH[k]||6;st.appendChild(e)});
 $('#hint').style.display=done?'block':'none';
 if(G.fries)sd.innerHTML+=`<img src="${IMG.fries}" style="left:52%;top:38%;width:13%">`;
 if(G.cola)sd.innerHTML+=`<img src="${IMG.cola}" style="left:55%;top:19%;width:10%">`}
function add(k){if(!G.alive||!G.cust||!G.cust.here)return reach();
 if(k=='patty'){const i=G.grill.findIndex(x=>!x);if(i<0)return toast('Izgara dolu!','#fc3');G.grill[i]={t:0};SFX.sizzle();return}
 if(k=='fries'||k=='cola'){G[k]=G[k]?0:1;SFX.drop();renderTray();return}
 if(k=='bunB'&&G.layers.length)return toast('Alt ekmek en altta olmalı','#fc3');
 if(SAUCE[k]&&G.layers.includes(k))return;
 if(G.layers.includes('bunT'))return toast('Üst ekmek en üste!','#fc3');
 if(k=='bunB'&&G.layers.includes('bunB'))return;
 G.layers.push(k);SFX.drop();renderTray()}
function clearTray(){SFX.trash();G.layers=[];G.fries=0;G.cola=0;renderTray();reach()}
document.querySelectorAll('.slot').forEach((s,i)=>s.onclick=()=>{const g=G&&G.grill[i];if(!g||g.t<6)return;G.grill[i]=null;
 if(G.layers.includes('bunT'))return;G.layers.push(g.t>14?'burnt':'patty');reach();renderTray()});

// === Servis ===
function serve(){if(!G.alive||!G.cust||!G.cust.here)return;const o=G.cust.order,L=G.layers,cnt=k=>L.filter(x=>x==k).length;
 const ok=cnt('bunB')==1&&cnt('bunT')==1&&cnt('burnt')==0&&cnt('patty')==(o.patty||0)&&['cheese','tomato','lettuce','ketchup','mustard','mayo'].every(k=>cnt(k)==(o[k]||0))&&(G.fries||0)==(o.fries||0)&&(G.cola||0)==(o.cola||0);
 reach();
 if(ok){const tip=Math.round(4*(1-G.cust.t/G.cust.max))*(G.up.tip?2:1),gain=Math.round((price(o)+tip)*(G.up.gold?1.25:1));G.money+=gain;G.served++;toast(`+${gain}`,'#fe3');SFX.good();save();drawPerson(G.cust.c,G.cust.p,1)}
 else{toast('Yanlış sipariş!','#f55');SFX.bad();drawPerson(G.cust.c,G.cust.p,0)}
 G.layers=[];G.fries=0;G.cola=0;renderTray();hud();
 leave()}

function hud(){$('#hud').innerHTML=`SERVİS ${G.served}`;$('#reg').innerHTML=G.money}
function end(){G.alive=false;$('#bubble').classList.remove('on');const best=Math.max(G.served,+(localStorage.getItem('burgerBest')||0));try{localStorage.setItem('burgerBest',best)}catch(e){}
 $('#ovs').innerHTML=`Oyun bitti!<br>Servis: ${G.served} &nbsp; Para: ${G.money}<br>En iyi: ${best}`;$('#start').textContent='Tekrar oyna';$('#ov').style.display='flex'}

function tick(){if(!G||!G.alive||G.paused)return;
 document.querySelectorAll('.slot').forEach((s,i)=>{const g=G.grill[i],im=s.querySelector('img'),u=s.querySelector('u');
  if(!g){im.style.display='none';u.style.display='none';return}
  g.t+=.1*(G.up.fast?1.5:1);if(g.t>=6&&!g.ok){g.ok=1;SFX.ding()}im.style.display='block';u.style.display='block';im.src=g.t<6?IMG.raw:IMG.cooked;im.style.filter=g.t>14?'brightness(.3)':'none';
  u.firstElementChild.style.width=Math.min(100,g.t/14*100)+'%';u.firstElementChild.style.background=g.t<6?'#fc3':g.t<14?'#4c4':'#f33'});
 const c=G.cust;if(c&&c.here){c.t+=.1;const r=1-c.t/c.max;$('#pat i').style.width=Math.max(0,r*100)+'%';$('#pat i').style.background=r>.5?'#4c4':r>.25?'#fc3':'#e33';
  drawPerson(c.c,c.p,r);
  if(c.t>=c.max){toast('Müşteri sıkıldı!','#f55');SFX.bad();c.here=false;G.layers=[];G.fries=0;G.cola=0;renderTray();leave()}}}

const SK='burgerSave2',UP=[['fast','Hızlı Izgara','Köfteler %50 daha hızlı pişer',40],['pat','Sabırlı Müşteri','Müşteriler %35 daha çok bekler',60],['tip','Bahşiş Kavanozu','Bahşişler iki katı',50],['slot','Dördüncü Göz','Izgarada 1 köfte yeri daha',80],['gold','Altın Tepsi','Kazancın %25 artar',120]];
let SV={};try{SV=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){}
function save(){try{SV={money:G.money,served:G.served,up:G.up};localStorage.setItem(SK,JSON.stringify(SV))}catch(e){}}
function applyUp(){if(G.up.slot&&G.grill.length<4){G.grill.push(null);document.querySelectorAll('.slot')[3].style.display='flex'}$('#trayimg').style.filter=G.up.gold?'hue-rotate(40deg) saturate(1.5) brightness(1.2)':''}
function shop(){const sh=$('#shop');G.paused=true;SFX.pick();sh.style.display='flex';const cn=`<img src="${IMG.coin}">`;
 sh.innerHTML=`<div class="pn"><div class="tt">DÜKKAN <span>${G.money}${cn}</span></div>`+UP.map(([k,n,d,p])=>`<div class="row"><div><b>${n}</b><br><small>${d}</small></div>${G.up[k]?'<i class="ok">ALINDI</i>':`<button data-k="${k}" ${G.money<p?'disabled':''}>${p}${cn}</button>`}</div>`).join('')+'<button id="shx">KAPAT</button></div>';
 sh.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const u=UP.find(x=>x[0]==b.dataset.k);if(G.money>=u[3]&&!G.up[u[0]]){G.money-=u[3];G.up[u[0]]=1;SFX.coin();applyUp();hud();save();shop()}});
 $('#shx').onclick=()=>{sh.style.display='none';G.paused=false}}
function start(){ac();G={alive:true,paused:false,served:SV.served||0,money:SV.money||0,up:SV.up||{},layers:[],fries:0,cola:0,grill:[null,null,null],cust:null};
 applyUp();$('#ov').style.display='none';renderTray();hud();spawn()}

// === SES (8-bit, WebAudio) ===
let AC,mg,MUT=false;try{MUT=localStorage.getItem('burgerMute')=='1'}catch(e){}
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.6;mg.connect(AC.destination)}if(AC.state=='suspended')AC.resume();return AC}
function tone(f,d,ty='square',v=.12,t0=0,f2){if(MUT||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02)}
function noise(d,v=.08,fq=3000){if(MUT||!AC)return;const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='highpass';f.frequency.value=fq;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(mg);s.start()}
const SFX={pick:()=>tone(520,.06,'square',.08),drop:()=>tone(240,.1,'square',.12,0,110),sizzle:()=>noise(.7,.09,2500),ding:()=>{tone(1319,.12,'triangle',.12);tone(1760,.25,'triangle',.1,.1)},
 good:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.13,'square',.11,i*.08));setTimeout(()=>SFX.coin(),380)},bad:()=>{tone(200,.25,'sawtooth',.13,0,90);tone(150,.3,'sawtooth',.11,.18,70)},
 coin:()=>{tone(988,.07,'square',.1);tone(1319,.25,'square',.1,.07)},bell:()=>{tone(1568,.3,'triangle',.14);tone(2093,.4,'triangle',.09,.06)},trash:()=>noise(.25,.1,600)};
const MEL=[392,0,494,0,587,0,494,0,440,0,523,0,659,0,523,0,392,0,494,0,587,0,784,0,698,0,659,0,587,0,523,0],BAS=[131,131,196,196,175,175,196,196,131,131,196,196,175,175,147,147];let ms=0;
setInterval(()=>{if(!AC||MUT||!G||!G.alive||G.paused)return;const m=MEL[ms%32],b=BAS[(ms>>1)%16];if(m)tone(m,.2,'square',.03);if(ms%2==0)tone(b,.4,'triangle',.07);ms++},230);
// === Açılış ===
(async()=>{
 const items=[['bunB','Alt ekmek',IMG],['patty','Çiğ köfte'],['cheese','Peynir'],['tomato','Domates'],['lettuce','Marul'],['ketchup','Ketçap'],['mustard','Hardal'],['mayo','Mayonez'],['bunT','Üst ekmek'],['fries','Patates'],['cola','Kola']];
 const small=['raw','cooked','bunT','bunB','tomato','lettuce','mayo','ketchup','mustard','fries','cola','coin','burger'];
 await Promise.all([...small.map(async k=>IMG[k]=await prep(F[k],400,true)),
  prep(F.tray,1000,false).then(v=>IMG.tray=v),prep(F.hands,1000,false).then(v=>IMG.hands=v)]);
 (()=>{const c=document.createElement('canvas');c.width=16;c.height=7;const x=c.getContext('2d'),r=(k,a,b,w,h)=>{x.fillStyle=k;x.fillRect(a,b,w,h)};
 r('#000',0,0,16,7);r('#fbd51a',1,1,14,4);r('#f5b800',1,4,14,1);r('#000',4,2,2,2);r('#000',10,2,1,1);r('#fff6',2,1,5,1);IMG.cheese=c.toDataURL()})();
 $('#bg').src=EMB[F.bg];$('#trayimg').src=IMG.tray;$('#hands').src=IMG.hands;
 const ST=[['tomato','Domates',1.2,17,8],['lettuce','Marul',1.2,36,8],['cheese','Peynir',1.2,55,8],
 ['ketchup','Ketçap',90.8,21,8],['mustard','Hardal',90.8,38,8],['mayo','Mayonez',90.8,55,8],
 ['patty','Çiğ köfte',14,63.5,8],['bunB','Alt ekmek',68.5,86.3,7.5],['bunT','Üst ekmek',76.2,86.3,7.5],['fries','Patates',83.9,86.3,7.5],['cola','Kola',91.6,86.3,7.5]];
 const GW={tomato:5,lettuce:6,cheese:6.5,ketchup:3.4,mustard:3.4,mayo:5.5,patty:7,bunB:9,bunT:9,fries:6,cola:5},SRC=k=>k=='patty'?IMG.raw:IMG[k];
 const stg=$('#stage');
 ST.forEach(([k,l,x,y,w])=>{const d=document.createElement('div');d.className='cr';d.dataset.k=k;d.style.cssText=`left:${x}%;top:${y}%;width:${w}%`;
  d.innerHTML=`<div class="in"><img src="${SRC(k)}" draggable="false"></div><div class="lb">${l}</div>`;stg.appendChild(d)});
 let D=null;const hd=$('#hands'),pt=e=>{const r=stg.getBoundingClientRect();return[(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100]};
 const inR=(el,e)=>{const r=el.getBoundingClientRect();return e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom};
 function mv(e){const[px,py]=pt(e);D.g.style.left=px+'%';D.g.style.top=py+'%';hd.style.left=(px-21)+'%';hd.style.top=(py-26)+'%';
  if(Math.hypot(e.clientX-D.x,e.clientY-D.y)>10)D.moved=1}
 document.querySelectorAll('.cr').forEach(el=>el.addEventListener('pointerdown',e=>{if(!G||!G.alive||D)return;e.preventDefault();
  const g=document.createElement('div');g.className='ghost';g.style.cssText=`width:${GW[el.dataset.k]}%;transform:translate(-50%,-50%)`;g.innerHTML=`<img src="${SRC(el.dataset.k)}">`;stg.appendChild(g);
  D={k:el.dataset.k,g,x:e.clientX,y:e.clientY,moved:0};ac();SFX.pick();hd.classList.add('drag');mv(e)}));
 addEventListener('pointermove',e=>{if(D)mv(e)});
 addEventListener('pointercancel',()=>{if(!D)return;D.g.remove();hd.classList.remove('drag');$('#tray').style.opacity='';D=null});
 addEventListener('pointerup',e=>{if(!D)return;const k=D.k;D.g.remove();$('#tray').style.opacity='';hd.classList.remove('drag');const m=D.moved;D=null;
  if(k=='tray'){if(m&&inR($('#win'),e))serve();else if(m&&inR($('#bin'),e))clearTray();return}
  if(!m)return add(k);
  if(k=='patty'){if(inR($('#grill'),e)||inR($('#grill').parentElement.querySelector('#grill'),e))add(k);return}
  if(inR($('#tray'),e))add(k)});
 (()=>{const c=document.createElement('canvas');c.width=16;c.height=20;const x=c.getContext('2d'),r=(k,a,b,w,h)=>{x.fillStyle=k;x.fillRect(a,b,w,h)};
  r('#000',6,0,4,2);r('#000',1,2,14,3);r('#aab',2,3,12,1);r('#000',2,5,12,15);r('#8a9099',3,5,10,14);r('#5b6068',5,7,1,10);r('#5b6068',8,7,1,10);r('#5b6068',11,7,1,10);IMG.bin=c.toDataURL()})();
 const bn=document.createElement('div');bn.id='bin';bn.innerHTML=`<img src="${IMG.bin}">`;stg.appendChild(bn);
 $('#tray').addEventListener('pointerdown',e=>{if(!G||!G.alive||D)return;if(!G.layers.length&&!G.fries&&!G.cola)return;e.preventDefault();
  const g=$('#tray').cloneNode(true);const h=g.querySelector('#hint');if(h)h.remove();g.querySelectorAll('.ly').forEach(n=>n.classList.remove('new'));g.className='ghost';g.style.transform='translate(-50%,-50%)';stg.appendChild(g);$('#tray').style.opacity='.3';
  D={k:'tray',g,x:e.clientX,y:e.clientY,moved:0};hd.classList.add('drag');mv(e)});
 const mt=()=>{$('#mute').textContent=MUT?'SES KAPALI':'SES AÇIK'};mt();$('#mute').onclick=()=>{ac();MUT=!MUT;try{localStorage.setItem('burgerMute',MUT?'1':'0')}catch(e){}mt();SFX.pick()};$('#regbtn').onclick=()=>G&&G.alive&&shop();$('#rst').onclick=()=>{try{localStorage.removeItem(SK)}catch(e){}SV={};$('#rst').textContent='Silindi'};
 $('#start').textContent='Başla';$('#start').onclick=start;
 setInterval(tick,100);
})();
